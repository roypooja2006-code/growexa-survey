<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growexa — Quick Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#050914;
    --bg-1:#0a1128;
    --card:rgba(255,255,255,0.035);
    --card-border:rgba(255,255,255,0.09);
    --blue:#3d7bff;
    --purple:#8b46ff;
    --teal:#2fe6b8;
    --text:#f2f5fc;
    --text-dim:#93a0c2;
    --text-dimmer:#5b6688;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(139,70,255,0.16), transparent 40%),
      radial-gradient(circle at 85% 88%, rgba(47,230,184,0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(61,123,255,0.14), transparent 40%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px 20px;
  }
  .progress-track{
    position:fixed; top:0; left:0; width:100%; height:3px;
    background:rgba(255,255,255,0.06); z-index:10;
  }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--blue),var(--purple),var(--teal));
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .stage{
    width:100%; max-width:560px;
    animation:fadeUp .5s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .stage{animation:none;}
    .progress-fill{transition:none;}
  }

  /* logo mark */
  .mark{ display:flex; align-items:center; gap:10px; margin-bottom:36px; }
  .mark svg{ width:34px; height:34px; }
  .mark-word{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:0.3px;}
  .mark-word .x{ background:linear-gradient(90deg,var(--blue),var(--purple),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* HERO */
  .hero-eyebrow{ color:var(--text-dim); font-size:14px; margin-bottom:14px; }
  h1.hero-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(32px,6vw,46px);
    line-height:1.12;
    letter-spacing:-0.5px;
    margin-bottom:18px;
    max-width:11.5ch;
  }
  .hero-title .grad{ background:linear-gradient(100deg,var(--blue),var(--purple) 55%,var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-copy{ color:var(--text-dim); font-size:16px; line-height:1.6; max-width:46ch; margin-bottom:34px; }
  .hero-copy strong{ color:var(--text); font-weight:600; }

  .btn-primary{
    appearance:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:16px;
    color:#04070f;
    background:linear-gradient(100deg,var(--teal),var(--blue));
    padding:15px 26px; border-radius:11px;
    display:inline-flex; align-items:center; gap:10px;
    transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 10px 30px -12px rgba(61,123,255,0.55);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 16px 34px -12px rgba(139,70,255,0.55); }
  .btn-primary:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }

  /* QUESTION */
  .q-meta{ color:var(--text-dimmer); font-size:13px; margin-bottom:14px; }
  h2.q-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(23px,4vw,29px);
    line-height:1.3;
    margin-bottom:28px;
    max-width:19ch;
  }
  .options{ display:flex; flex-direction:column; gap:11px; margin-bottom:26px; }
  .opt{
    text-align:left;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text);
    font-family:'Inter',sans-serif; font-size:15.5px; font-weight:500;
    padding:16px 18px; border-radius:11px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    transition:border-color .16s ease, background .16s ease, transform .12s ease;
  }
  .opt:hover{ border-color:rgba(61,123,255,0.55); background:rgba(61,123,255,0.07); }
  .opt:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .opt.selected{ border-color:var(--teal); background:rgba(47,230,184,0.09); }
  .opt .tick{ width:18px; height:18px; border-radius:50%; border:1.5px solid var(--text-dimmer); flex-shrink:0; margin-left:14px; position:relative; }
  .opt.selected .tick{ border-color:var(--teal); background:var(--teal); }
  .opt.selected .tick::after{ content:''; position:absolute; left:5px; top:2px; width:5px; height:9px; border:solid #04070f; border-width:0 2px 2px 0; transform:rotate(40deg); }

  .row-actions{ display:flex; align-items:center; justify-content:space-between; }
  .btn-back{
    background:none; border:none; color:var(--text-dim); font-family:'Inter'; font-size:14px;
    cursor:pointer; display:flex; align-items:center; gap:6px; padding:8px 4px;
  }
  .btn-back:hover{ color:var(--text); }
  .btn-back:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .btn-next{
    appearance:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px;
    color:#04070f; background:linear-gradient(100deg,var(--blue),var(--purple));
    padding:12px 22px; border-radius:10px;
    transition:opacity .16s ease, transform .16s ease;
  }
  .btn-next.unselected{ opacity:0.55; }
  .btn-next:hover{ transform:translateY(-1px); }

  /* CONTACT STEP */
  .field{
    width:100%; background:var(--card); border:1px solid var(--card-border);
    color:var(--text); font-family:'Inter'; font-size:15px; padding:14px 16px;
    border-radius:11px; margin-bottom:12px;
  }
  .field::placeholder{ color:var(--text-dimmer); }
  .field:focus{ outline:2px solid var(--blue); outline-offset:1px; }
  .skip-link{ color:var(--text-dimmer); font-size:13.5px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; background:none; border:none; font-family:'Inter'; }
  .err-line{ color:#ff8b8b; font-size:13px; margin-top:10px; min-height:16px; }
  .debug-line{ color:var(--text-dimmer); font-size:11px; margin-top:18px; opacity:0.6; }

  /* THANKS */
  .thanks-icon{ width:56px; height:56px; margin-bottom:22px; }
  .tagline{ display:flex; gap:8px; flex-wrap:wrap; margin-top:26px; font-size:13px; letter-spacing:0.4px; color:var(--text-dimmer); }
  .tagline b{ color:var(--text-dim); font-weight:600; }

  footer{ text-align:center; padding:18px; color:var(--text-dimmer); font-size:12.5px; }

  /* ADMIN */
  .admin-wrap{ max-width:760px; width:100%; padding:60px 20px 60px; margin:0 auto; }
  .admin-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:10px;}
  .admin-title{ font-family:'Space Grotesk'; font-weight:700; font-size:26px; }
  .admin-count{ color:var(--text-dim); font-size:14px; }
  .admin-block{ margin-top:34px; }
  .admin-q{ font-weight:600; font-size:15px; margin-bottom:12px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .bar-label{ width:150px; flex-shrink:0; font-size:13.5px; color:var(--text-dim); }
  .bar-track{ flex:1; height:10px; background:rgba(255,255,255,0.06); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--blue),var(--purple),var(--teal)); border-radius:6px; }
  .bar-pct{ width:38px; text-align:right; font-size:13px; color:var(--text-dimmer); flex-shrink:0; }
  .contact-list{ margin-top:14px; font-size:14px; color:var(--text-dim); line-height:2; }
  .empty-state{ color:var(--text-dimmer); font-size:14px; margin-top:20px; }
</style>
</head>
<body>

<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="wrap" id="appRoot"></div>
<footer id="pageFooter">Growexa · Automate · Engage · Convert · Grow</footer>

<script>
const QUESTIONS = [
  { id:'q1', text:"What do you use to communicate with customers most?", options:["Email","WhatsApp","Both","Phone Calls"] },
  { id:'q2', text:"How do you send messages currently?", options:["Manually","Bulk Tool","CRM / Software","I don't"] },
  { id:'q3', text:"Which feature would you use most?", options:["Bulk Email","Bulk WhatsApp","AI Message Writing","Auto Follow-ups"] },
  { id:'q4', text:"What takes the most time?", options:["Writing messages","Sending messages","Follow-ups","Tracking replies"] },
  { id:'q5', text:"Would automation save your time?", options:["Yes, a lot","Maybe","Not sure","No"] },
  { id:'q6', text:"How often do you message customers?", options:["Daily","Weekly","Monthly","Rarely"] },
  { id:'q7', text:"What matters most in an automation tool?", options:["Easy to use","Low cost","Fast sending","Analytics"] },
  { id:'q8', text:"What is your business size?", options:["Student / Freelancer","Small Business","Startup","Company"] },
  { id:'q9', text:"Would you use one platform for Email + WhatsApp automation?", options:["Yes","Maybe","No"] },
  { id:'q10', text:"Would you use Growexa?", options:["Yes","No","Maybe"] },
];
const ADMIN_KEY = "growexa2026";
const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbySgw4K6woTE4_nixCPJdPqEi4ZKwUHQ-4WBswclCm7zfxDNGSCQOtEzVq-caGToFwruA/exec"; // from Deploy > New deployment
const TOTAL = QUESTIONS.length;

const root = document.getElementById('appRoot');
const progressFill = document.getElementById('progressFill');
const footer = document.getElementById('pageFooter');

let state = { stage:'hero', qIndex:0, answers:{}, name:'', email:'', phone:'' };

function logoMark(){
  return `<div class="mark">
    <svg viewBox="0 0 40 40" fill="none">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="40" y2="40">
          <stop offset="0%" stop-color="#3d7bff"/>
          <stop offset="55%" stop-color="#8b46ff"/>
          <stop offset="100%" stop-color="#2fe6b8"/>
        </linearGradient>
      </defs>
      <path d="M31 8.5C27.6 5.6 23.4 4 19 4 9.6 4 2 11.6 2 21s7.6 17 17 17c4 0 7.7-1.4 10.6-3.7" stroke="url(#lg)" stroke-width="4.4" stroke-linecap="round" fill="none"/>
      <path d="M16 24l6-6 5 5 8-9" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M30 12l5 2-1 5.3" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="mark-word">GROW<span class="x">EXA</span></span>
  </div>`;
}

function updateProgress(){
  if(state.stage === 'question'){
    progressFill.style.width = (((state.qIndex) / TOTAL) * 100) + '%';
  } else if(state.stage === 'thanks'){
    progressFill.style.width = '100%';
  } else {
    progressFill.style.width = '0%';
  }
}

function render(){
  updateProgress();
  if(state.stage === 'hero') return renderHero();
  if(state.stage === 'intake') return renderIntake();
  if(state.stage === 'question') return renderQuestion();
  if(state.stage === 'thanks') return renderThanks();
  if(state.stage === 'admin') return renderAdmin();
}

function renderHero(){
  root.innerHTML = `
    <div class="stage">
      ${logoMark()}
      <div class="hero-eyebrow">Quick survey </div>
      <h1 class="hero-title">Help us build <span class="grad">Growexa</span> around how you actually work</h1>
      <p class="hero-copy">We're building a tool that <strong>automates and sends Email + WhatsApp messages for you</strong> — writing, sending, and following up with customers automatically. Ten quick questions, no right answers.</p>
      <button class="btn-primary" id="startBtn">Let's go →</button>
    </div>
  `;
  document.getElementById('startBtn').addEventListener('click', ()=>{
    state.stage = 'intake'; render();
  });
}

function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function validPhone(v){ return /^[0-9+\-\s()]{7,15}$/.test(v); }

function renderIntake(){
  root.innerHTML = `
    <div class="stage">
      <div class="q-meta">BEFORE WE START</div>
      <h2 class="q-title">Who are we talking to?</h2>
      <input class="field" id="nameInput" type="text" placeholder="Full name" value="${state.name||''}">
      <input class="field" id="emailInput" type="email" placeholder="Email address" value="${state.email||''}">
      <input class="field" id="phoneInput" type="tel" placeholder="Phone / WhatsApp number" value="${state.phone||''}">
      <div class="row-actions" style="margin-top:18px;">
        <button class="btn-back" id="backBtn0">← Back</button>
        <button class="btn-next" id="intakeNextBtn">Next</button>
      </div>
      <div class="empty-state" id="intakeError" style="margin-top:2px;"></div>
    </div>
  `;
  document.getElementById('backBtn0').addEventListener('click', ()=>{ state.stage='hero'; render(); });
  document.getElementById('intakeNextBtn').addEventListener('click', ()=>{
    const name = document.getElementById('nameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const errEl = document.getElementById('intakeError');
    if(!name || !email || !phone){
      errEl.textContent = 'Please fill in your name, email, and phone number.'; return;
    }
    if(!validEmail(email)){ errEl.textContent = 'That email doesn\'t look right.'; return; }
    if(!validPhone(phone)){ errEl.textContent = 'That phone number doesn\'t look right.'; return; }
    state.name = name; state.email = email; state.phone = phone;
    state.stage = 'question'; state.qIndex = 0; render();
  });
}

function renderQuestion(){
  const q = QUESTIONS[state.qIndex];
  const selected = state.answers[q.id];
  root.innerHTML = `
    <div class="stage">
      <div class="q-meta">QUESTION ${state.qIndex+1} OF ${TOTAL}</div>
      <h2 class="q-title">${q.text}</h2>
      <div class="options" id="optWrap">
        ${q.options.map((opt,i)=>`
          <button type="button" class="opt${selected===opt?' selected':''}" data-opt="${i}">
            <span>${opt}</span><span class="tick"></span>
          </button>
        `).join('')}
      </div>
      <div class="row-actions">
        <button type="button" class="btn-back" id="backBtn">${state.qIndex===0 ? '' : '← Back'}</button>
        <button type="button" class="btn-next${selected?'':' unselected'}" id="nextBtn">${state.qIndex===TOTAL-1?'Continue':'Next'}</button>
      </div>
      <div class="err-line" id="errLine"></div>
      <div class="debug-line" id="debugLine">debug: qIndex=${state.qIndex} selected=${selected||'none'}</div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const opt = q.options[+btn.dataset.opt];
      state.answers[q.id] = opt;
      renderQuestion();
    });
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(state.qIndex===0){ state.stage='intake'; render(); }
    else { state.qIndex -= 1; render(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    const errEl = document.getElementById('errLine');
    if(!state.answers[q.id]){
      errEl.textContent = 'Pick an answer first.';
      return;
    }
    errEl.textContent = '';
    advance();
  });
}

function advance(){
  if(state.qIndex < TOTAL-1){ state.qIndex += 1; render(); }
  else { submitResponse(); }
}

async function submitResponse(){
  const id = 'response:' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  const payload = {
    name: state.name || null,
    email: state.email || null,
    phone: state.phone || null,
    answers: state.answers,
    submittedAt: new Date().toISOString()
  };
  try{
    await window.storage.set(id, JSON.stringify(payload), true);
  }catch(e){
    console.error('Could not save response', e);
  }
  if(SHEET_WEBHOOK_URL && !SHEET_WEBHOOK_URL.startsWith('PASTE_')){
    try{
      // no-cors: Apps Script web apps don't return permissive CORS headers,
      // but the POST still goes through and doPost() still runs / emails you.
      await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
    }catch(e){
      console.error('Could not notify sheet/email', e);
    }
  }
  state.stage = 'thanks';
  render();
}

function renderThanks(){
  root.innerHTML = `
    <div class="stage">
      <svg class="thanks-icon" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="27" stroke="url(#lg2)" stroke-width="2.4"/>
        <path d="M17 29l7 7 15-16" stroke="url(#lg2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="lg2" x1="0" y1="0" x2="56" y2="56">
          <stop offset="0%" stop-color="#3d7bff"/><stop offset="55%" stop-color="#8b46ff"/><stop offset="100%" stop-color="#2fe6b8"/>
        </linearGradient></defs>
      </svg>
      <h1 class="hero-title" style="font-size:clamp(26px,5vw,32px); max-width:16ch;">Thanks — that helps us build the right thing.</h1>
      <p class="hero-copy">Your answers go straight into shaping what Growexa automates first.</p>
      <div class="tagline"><b>Automate</b> · <b>Engage</b> · <b>Convert</b> · <b>Grow</b></div>
    </div>
  `;
}

/* ---------- Admin dashboard (private — open with ?admin=growexa2026) ---------- */
async function loadAllResponses(){
  const keysRes = await window.storage.list('response:', true);
  const keys = (keysRes && keysRes.keys) || [];
  const results = [];
  for(const k of keys){
    try{
      const r = await window.storage.get(k, true);
      if(r && r.value) results.push(JSON.parse(r.value));
    }catch(e){ /* skip unreadable entries */ }
  }
  results.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  return results;
}

async function renderAdmin(){
  root.innerHTML = `<div class="admin-wrap" id="adminRoot">
    ${logoMark()}
    <div class="admin-head"><div class="admin-title">Survey results</div><div class="admin-count" id="countLabel">Loading…</div></div>
    <div id="adminBody"></div>
  </div>`;
  footer.style.display = 'none';
  progressFill.parentElement.style.display = 'none';

  let responses;
  try{
    responses = await loadAllResponses();
  }catch(e){
    document.getElementById('adminBody').innerHTML = `<div class="empty-state">Couldn't load responses right now. Try refreshing.</div>`;
    return;
  }

  document.getElementById('countLabel').textContent = responses.length + (responses.length===1 ? ' response' : ' responses');

  if(responses.length === 0){
    document.getElementById('adminBody').innerHTML = `<div class="empty-state">No responses yet. Share the survey link to start collecting answers.</div>`;
    return;
  }

  let html = '';
  QUESTIONS.forEach(q=>{
    const counts = {};
    q.options.forEach(o=> counts[o]=0);
    responses.forEach(r=>{
      const a = r.answers ? r.answers[q.id] : null;
      if(a && counts.hasOwnProperty(a)) counts[a] += 1;
    });
    const total = responses.length;
    html += `<div class="admin-block"><div class="admin-q">${q.text}</div>`;
    q.options.forEach(o=>{
      const pct = total ? Math.round((counts[o]/total)*100) : 0;
      html += `<div class="bar-row">
        <div class="bar-label">${o}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-pct">${pct}%</div>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<div class="admin-block"><div class="admin-q">Respondents (${responses.length})</div>`;
  html += responses.length
    ? `<div class="contact-list">${responses.map(r=>
        `${r.name||'—'} · ${r.email||'—'} · ${r.phone||'—'}`
      ).join('<br>')}</div>`
    : `<div class="empty-state">No responses yet.</div>`;
  html += `</div>`;

  document.getElementById('adminBody').innerHTML = html;
}

/* ---------- boot ---------- */
const params = new URLSearchParams(window.location.search);
if(params.get('admin') === ADMIN_KEY){
  state.stage = 'admin';
}
render();
</script>
</body>
</html>
